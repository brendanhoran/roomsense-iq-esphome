# RoomSense IQ - ESPHome firmware
#
# Replacement firmware for the RoomSense IQ (ESP32-S3-WROOM-1) air-quality and
# presence sensor, after the upstream ESP-IDF project was abandoned. Every
# usable sensor is exposed to Home Assistant via the native ESPHome API.
#
# Pin map recovered from the original firmware (firmware/sdkconfig,
# firmware/main/rgb_led.h, firmware/components/*). Confirm the LD2410 RX/TX
# orientation on the bench at first flash.
#
# Not carried over from the original firmware:
#   - CO (carbon monoxide) sensor : a separate analog gas sensor, distinct from
#                      the SCD4x carbon dioxide (CO2) below. Wired to ADC2
#                      (GPIO20), which the ESP32-S3 cannot read while Wi-Fi is
#                      active. Dropped.
#   - Analog PIR     : superseded by the LD2410 radar presence. Dropped.

substitutions:
  name: roomsense-iq
  friendly_name: RoomSense IQ

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 8MB
  framework:
    type: esp-idf

# --- Connectivity -----------------------------------------------------------

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Fallback hotspot if the configured network is unavailable.
  ap:
    ssid: "RoomSense-IQ Setup"
    password: !secret ap_password

captive_portal:

# Encrypted native API. Home Assistant auto-discovers the device and all
# entities below, with no MQTT broker required.
api:
  encryption:
    key: !secret api_key
  # Do not reboot when no API client is connected. The default (15 min) makes the
  # device reboot-loop until it is added to Home Assistant, needlessly restarting
  # the SGP41 warm-up and SCD4x self-heating each time.
  reboot_timeout: 0s

ota:
  - platform: esphome

# Route logs to UART0 (the CP2102N/USB-C cable). This board does not break out
# the ESP32-S3 native USB, so without this the console goes to USB-Serial-JTAG
# and no logs appear on /dev/ttyUSB0.
logger:
  hardware_uart: UART0
  # The SGP41 logs a "Stabilizing (x/90)" line every second during its ~90s
  # warm-up. Silence just that component; everything else stays at DEBUG.
  logs:
    sgp4x: INFO

web_server:

# --- Custom PM sensor component ---------------------------------------------

external_components:
  - source:
      type: local
      path: components
    components: [mpm10]

# --- Buses ------------------------------------------------------------------

# Shared I2C bus: SCD4x (0x62), SGP40 (0x59) and MPM10 (0x4D).
# Capped at 100 kHz because the SCD4x only supports standard-mode I2C.
i2c:
  sda: GPIO12
  scl: GPIO13
  frequency: 100kHz

# HLK-LD2410 mmWave radar. 256000 baud, 8N1.
uart:
  id: ld2410_uart
  tx_pin: GPIO9
  rx_pin: GPIO8
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

ld2410:
  uart_id: ld2410_uart

# --- Sensors ----------------------------------------------------------------

sensor:
  # CO2, temperature and humidity.
  - platform: scd4x
    id: scd4x_co2
    # Self-heating compensation: reported temperature = raw - offset, so a
    # larger value lowers the reported temperature. It compensates for heat
    # from the enclosure and does NOT affect the CO2 reading (per Sensirion).
    # The original firmware used 12.1 C, which measured ~1.4 C low against a
    # calibrated reference, so trimmed to 10.7 C. Re-tune at thermal
    # equilibrium against a trusted thermometer.
    temperature_offset: 10.7
    # Automatic self-calibration assumes the sensor sees fresh ~400 ppm air
    # regularly. This room stays mostly closed (winter), so it rarely reaches
    # fresh air; ASC would drift the baseline low and undo the forced
    # recalibration. Disabled, so CO2 relies on the manual FRC button below.
    # Re-run the FRC every few months, or set back to true if the room starts
    # getting aired out regularly again.
    automatic_self_calibration: false
    co2:
      name: "Carbon dioxide"
    temperature:
      id: scd_temperature
      name: "Temperature"
    humidity:
      id: scd_humidity
      name: "Humidity"

  # VOC + NOx index (0-500). The fitted part is an SGP41 (auto-detected), so it
  # exposes NOx as well as VOC. Compensated with the SCD4x temperature/humidity.
  - platform: sgp4x
    voc:
      name: "VOC index"
    nox:
      name: "NOx index"
    compensation:
      temperature_source: scd_temperature
      humidity_source: scd_humidity

  # Particulate matter from the MPM10 module (custom component).
  - platform: mpm10
    update_interval: 30s
    pm1_0:
      name: "PM1"
    pm2_5:
      name: "PM2.5"
    pm10_0:
      name: "PM10"
    # Particle-number counts (per 0.1 L / dL of air), by minimum diameter.
    # The MPM10 also exposes atmospheric-mode mass (pm1_0_atm / pm2_5_atm /
    # pm10_0_atm) if you want the ambient-calibrated PM values as well.
    pm_0_3um:
      name: "Particles >0.3um"
    pm_0_5um:
      name: "Particles >0.5um"
    pm_1_0um:
      name: "Particles >1.0um"
    pm_2_5um:
      name: "Particles >2.5um"
    pm_5_0um:
      name: "Particles >5.0um"
    pm_10_0um:
      name: "Particles >10um"

  # Ambient light from the CdS photocell divider (ADC1, safe with Wi-Fi).
  # Raw divider voltage; add calibrate_linear if you want lux.
  - platform: adc
    pin: GPIO5
    name: "Light Level"
    attenuation: 12db
    update_interval: 30s

  # LD2410 distance readings.
  - platform: ld2410
    moving_distance:
      name: "Moving Target Distance"
    still_distance:
      name: "Still Target Distance"
    detection_distance:
      name: "Detection Distance"

binary_sensor:
  - platform: ld2410
    has_target:
      name: "Presence"
    has_moving_target:
      name: "Moving Target"
    has_still_target:
      name: "Still Target"

# --- SCD4x CO2 forced recalibration (FRC) -----------------------------------

# Align the CO2 reading to a known reference. The SCD4x factory accuracy is
# +-(50 ppm + 5% of reading), so two sensors can legitimately differ by ~150
# ppm; this pins the baseline to a value you trust. Procedure:
#   1. Put the device in stable, well-mixed air of a known CO2 level. Fresh
#      outdoor air (~420 ppm) is the gold-standard reference; alternatively,
#      sit it beside a trusted sensor in still indoor air.
#   2. Leave it running there for at least ~5 minutes (Sensirion requires >3
#      min of periodic measurement in constant CO2 before an FRC).
#   3. Set "CO2 recalibration target" to the reference ppm.
#   4. Press "CO2 forced recalibration".
# The correction is written to the sensor's baseline, so it survives reboots.

number:
  - platform: template
    id: scd4x_frc_target
    name: "CO2 recalibration target"
    entity_category: config
    unit_of_measurement: ppm
    min_value: 350
    max_value: 2000
    step: 5
    initial_value: 420
    optimistic: true
    restore_value: true
    mode: box

button:
  - platform: template
    name: "CO2 forced recalibration"
    entity_category: config
    on_press:
      - scd4x.perform_forced_calibration:
          id: scd4x_co2
          value: !lambda "return (int) id(scd4x_frc_target).state;"

# --- Status RGB LED (EAST1616RGBB4, common-anode via LEDC PWM) ---------------

output:
  - platform: ledc
    id: led_red
    pin: GPIO46
  - platform: ledc
    id: led_green
    pin: GPIO10
  - platform: ledc
    id: led_blue
    pin: GPIO3

light:
  - platform: rgb
    name: "Status LED"
    red: led_red
    green: led_green
    blue: led_blue
